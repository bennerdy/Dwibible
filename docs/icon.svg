<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A243B" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#0B0F1A" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#accent)" stroke-width="4" opacity="0.4"/>

  <!-- Holy Light / Rays glow -->
  <circle cx="256" cy="220" r="140" fill="url(#accent)" opacity="0.15" filter="blur(20px)"/>

  <!-- Open Bible Graphic -->
  <g filter="url(#shadow)">
    <!-- Left Page -->
    <path d="M256 310 C210 280 140 280 90 295 L90 170 C140 155 210 155 256 185 Z" fill="#F8FAFC"/>
    <!-- Right Page -->
    <path d="M256 310 C302 280 372 280 422 295 L422 170 C372 155 302 155 256 185 Z" fill="#F1F5F9"/>
    
    <!-- Spine / Center Ribbon -->
    <path d="M252 185 L260 185 L260 340 L256 332 L252 340 Z" fill="url(#gold)"/>
    
    <!-- Bookmark Gold Cross -->
    <g transform="translate(256, 130) scale(1.1)">
      <rect x="-4" y="-28" width="8" height="44" rx="2" fill="url(#gold)"/>
      <rect x="-16" y="-18" width="32" height="8" rx="2" fill="url(#gold)"/>
    </g>

    <!-- Page text lines hint -->
    <!-- Left page lines -->
    <line x1="120" y1="190" x2="230" y2="190" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="212" x2="225" y2="212" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="234" x2="230" y2="234" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="120" y1="256" x2="210" y2="256" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>

    <!-- Right page lines -->
    <line x1="282" y1="190" x2="392" y2="190" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="287" y1="212" x2="392" y2="212" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="282" y1="234" x2="392" y2="234" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
    <line x1="302" y1="256" x2="392" y2="256" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="256" y="405" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="44" fill="#FFFFFF" letter-spacing="2">DWIBIBLE</text>
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" fill="url(#accent)" letter-spacing="3">BM • ENGLISH</text>
</svg>
